name: Lab 4 Helm Chart

on:
  push:
    branches: [ lab4 ]

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create KinD cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: kind

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Master Validation Script
        run: |
          chmod +x ./tests/lab4_test.sh
          ./tests/lab4_test.sh